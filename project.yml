name: MangoReader
options:
  bundleIdPrefix: com.k800k
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MANGOREADER_ANILIST_OAUTH_CLIENT_ID: ""
    MANGOREADER_MYANIMELIST_OAUTH_CLIENT_ID: ""
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 1.0.0

packages:
  MangoReaderKit:
    path: Packages/MangoReaderKit

targets:
  MangoReader:
    type: application
    platform: iOS
    sources:
      - path: MangoReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.k800k.manko
        PRODUCT_NAME: MangoReader
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        INFOPLIST_FILE: MangoReader/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MangoReader/Resources/MangoReader.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": MangoReader/Resources/MangoReader-Catalyst.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    preBuildScripts:
      - name: Validate Tracker OAuth Configuration
        basedOnDependencyAnalysis: false
        script: |
          #!/bin/sh
          set -eu

          # Debug and ordinary Release builds remain available for local development.
          # App archives must not ship tracker entry points that can never authenticate.
          if [ "${CONFIGURATION:-}" != "Release" ] || [ "${ACTION:-}" != "install" ]; then
            exit 0
          fi

          missing=""
          if [ -z "${MANGOREADER_ANILIST_OAUTH_CLIENT_ID:-}" ]; then
            missing="MANGOREADER_ANILIST_OAUTH_CLIENT_ID"
          fi
          if [ -z "${MANGOREADER_MYANIMELIST_OAUTH_CLIENT_ID:-}" ]; then
            if [ -n "$missing" ]; then
              missing="$missing, MANGOREADER_MYANIMELIST_OAUTH_CLIENT_ID"
            else
              missing="MANGOREADER_MYANIMELIST_OAUTH_CLIENT_ID"
            fi
          fi

          if [ -n "$missing" ]; then
            echo "error: Missing public tracker OAuth client ID build setting(s): $missing" >&2
            echo "error: Set these values in Xcode Build Settings or pass them to xcodebuild." >&2
            exit 1
          fi
    dependencies:
      - package: MangoReaderKit
        product: MangoReaderDomain
      - package: MangoReaderKit
        product: MangoReaderData
      - package: MangoReaderKit
        product: MangoReaderSources
      - package: MangoReaderKit
        product: MangoReaderExtensions
      - package: MangoReaderKit
        product: MangoReaderReaders
      - package: MangoReaderKit
        product: MangoReaderSync

schemes:
  MangoReader:
    build:
      targets:
        MangoReader: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
