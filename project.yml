name: Manko
options:
  bundleIdPrefix: com.k800k
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MANKO_ANILIST_OAUTH_CLIENT_ID: ""
    MANKO_MYANIMELIST_OAUTH_CLIENT_ID: ""
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 1.0.0

packages:
  MankoKit:
    path: Packages/MankoKit

targets:
  Manko:
    type: application
    platform: iOS
    sources:
      - path: Manko
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.k800k.manko
        PRODUCT_NAME: Manko
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        INFOPLIST_FILE: Manko/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Manko/Resources/Manko.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Manko/Resources/Manko-Catalyst.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    preBuildScripts:
      - name: Validate Tracker OAuth Configuration
        basedOnDependencyAnalysis: false
        script: |
          #!/bin/sh
          set -eu

          # Debug and ordinary Release builds remain available for local development.
          # App archives must not ship tracker entry points that can never authenticate.
          if [ "${CONFIGURATION:-}" != "Release" ] || [ "${ACTION:-}" != "install" ]; then
            exit 0
          fi

          missing=""
          if [ -z "${MANKO_ANILIST_OAUTH_CLIENT_ID:-}" ]; then
            missing="MANKO_ANILIST_OAUTH_CLIENT_ID"
          fi
          if [ -z "${MANKO_MYANIMELIST_OAUTH_CLIENT_ID:-}" ]; then
            if [ -n "$missing" ]; then
              missing="$missing, MANKO_MYANIMELIST_OAUTH_CLIENT_ID"
            else
              missing="MANKO_MYANIMELIST_OAUTH_CLIENT_ID"
            fi
          fi

          if [ -n "$missing" ]; then
            echo "error: Missing public tracker OAuth client ID build setting(s): $missing" >&2
            echo "error: Set these values in Xcode Build Settings or pass them to xcodebuild." >&2
            exit 1
          fi
    dependencies:
      - package: MankoKit
        product: MankoDomain
      - package: MankoKit
        product: MankoData
      - package: MankoKit
        product: MankoSources
      - package: MankoKit
        product: MankoExtensions
      - package: MankoKit
        product: MankoReaders
      - package: MankoKit
        product: MankoSync

schemes:
  Manko:
    build:
      targets:
        Manko: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
